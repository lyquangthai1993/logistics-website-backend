services:
  # ─── NestJS API ───────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: logistics-backend:latest
    container_name: logistics-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - logistics-network

  # ─── Redis (for BullMQ workers) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: logistics-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - logistics-network
    # Redis không expose ra ngoài — chỉ accessible trong internal network
    # ports:
    #   - "6379:6379"

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: logistics-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - logistics-network

  # ─── Certbot (SSL auto-renewal) ────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: logistics-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Runs manually: docker compose run --rm certbot certonly ...
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  logistics-network:
    driver: bridge

volumes:
  redis-data:
  certbot-www:
  certbot-conf:
