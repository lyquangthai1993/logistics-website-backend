name: Railway Backend Deployment Pipeline

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dev
          - production

concurrency:
  group: railway-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # STAGE 1: PREFLIGHT & ENVIRONMENT CONFIGURATION
  # -------------------------------------------------------------
  stage-1-preflight:
    name: "🔍 1. Chuẩn bị Môi trường & Token"
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.setup.outputs.env_name }}
      target_url: ${{ steps.setup.outputs.target_url }}
    steps:
      - name: Setup Environment Variables
        id: setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            ENV_NAME="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="dev"
          fi

          if [ "$ENV_NAME" = "production" ]; then
            TARGET_URL="https://backend-tms-core-production.up.railway.app/api/v1/health"
          else
            TARGET_URL="https://backend-tms-core-dev.up.railway.app/api/v1/health"
          fi

          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "target_url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "🎯 Target Environment: $ENV_NAME"
          echo "🌐 Health Endpoint: $TARGET_URL"

  # -------------------------------------------------------------
  # STAGE 2: RAILWAY CLOUD DEPLOYMENT
  # -------------------------------------------------------------
  stage-2-deploy-cloud:
    name: "🚀 2. Triển khai Railway Cloud"
    needs: stage-1-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend Container
        env:
          RAILWAY_TOKEN: ${{ needs.stage-1-preflight.outputs.env_name == 'production' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_DEV_TOKEN }}
        run: |
          echo "🚀 Bắt đầu triển khai backend-tms-core lên ${{ needs.stage-1-preflight.outputs.env_name }}..."
          railway up --service backend-tms-core --environment "${{ needs.stage-1-preflight.outputs.env_name }}"

  # -------------------------------------------------------------
  # STAGE 3: LIVE HEALTH CHECK
  # -------------------------------------------------------------
  stage-3-health-check:
    name: "🌐 3. Kiểm tra Live API Health"
    needs: [stage-1-preflight, stage-2-deploy-cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Probe API Health Endpoint
        run: |
          TARGET_URL="${{ needs.stage-1-preflight.outputs.target_url }}"
          echo "🔍 Kiểm tra phản hồi trực tiếp từ $TARGET_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$TARGET_URL" || true)
            echo "Lần thử $i/12: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend API đã LIVE và phản hồi HTTP 200 OK!"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Quá thời gian chờ phản hồi từ health endpoint ($TARGET_URL)"
          exit 1

  # -------------------------------------------------------------
  # STAGE 4: DEPLOYMENT REPORT & AUDIT SUMMARY
  # -------------------------------------------------------------
  stage-4-summary:
    name: "📋 4. Tổng kết Deployment"
    needs: [stage-1-preflight, stage-2-deploy-cloud, stage-3-health-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate GitHub Step Summary
        run: |
          STATUS="${{ needs.stage-3-health-check.result == 'success' && '🟢 HOÀN TẤT & LIVE' || '🔴 THẤT BẠI' }}"
          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🚀 Báo Cáo Triển Khai Backend TMS Core
          | Hạng mục | Chi tiết |
          |---|---|
          | **Trạng thái** | $STATUS |
          | **Môi trường** | \`${{ needs.stage-1-preflight.outputs.env_name }}\` |
          | **Dịch vụ** | \`backend-tms-core\` (NestJS 11) |
          | **Health API** | \`${{ needs.stage-1-preflight.outputs.target_url }}\` |
          | **Commit SHA** | \`${{ github.sha }}\` |
          | **Nhánh Git** | \`${{ github.ref_name }}\` |
          | **Runtime** | Node.js 22 LTS |
          EOF
