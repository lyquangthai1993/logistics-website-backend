name: Railway Backend Deployment

on:
  push:
    branches:
      - dev
      - master
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - dev
          - production

concurrency:
  group: railway-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Determine Environment & Token
        id: env-setup
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.environment }}" != "auto" ]; then
            TARGET_ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            TARGET_ENV="production"
          else
            TARGET_ENV="dev"
          fi
          echo "env_name=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ steps.env-setup.outputs.env_name == 'production' && secrets.RAILWAY_PROD_TOKEN || secrets.RAILWAY_DEV_TOKEN }}
        run: |
          echo "🚀 Deploying backend-tms-core to ${{ steps.env-setup.outputs.env_name }}..."
          railway up --service backend-tms-core --environment "${{ steps.env-setup.outputs.env_name }}"

      - name: Verify Backend Deployment Health
        run: |
          if [ "${{ steps.env-setup.outputs.env_name }}" = "production" ]; then
            TARGET_URL="https://backend-tms-core-production.up.railway.app/api/v1/health"
          else
            TARGET_URL="https://backend-tms-core-dev.up.railway.app/api/v1/health"
          fi
          echo "🔍 Verifying backend health at $TARGET_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$TARGET_URL" || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy and responding with HTTP 200!"
              exit 0
            fi
            sleep 10
          done
          echo "⚠️ Health check timed out after 120s"
          exit 1
